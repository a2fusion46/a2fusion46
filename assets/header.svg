<svg width="100%" height="100%" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Background Wave 2 -->
  <path d="M0,150 C150,190 350,110 500,160 C650,210 800,130 900,170 L900,220 L0,220 Z" fill="url(#wave2)" />

  <!-- Background Wave 1 -->
  <path d="M0,165 C200,130 400,200 600,155 C750,120 850,170 900,160 L900,220 L0,220 Z" fill="url(#wave1)" />

  <!-- Decorative Tech Nodes -->
  <circle cx="80" cy="50" r="3" fill="#60a5fa" opacity="0.6" />
  <circle cx="120" cy="80" r="2" fill="#38bdf8" opacity="0.4" />
  <circle cx="820" cy="60" r="3" fill="#60a5fa" opacity="0.6" />
  <circle cx="780" cy="100" r="2" fill="#38bdf8" opacity="0.4" />
  <line x1="80" y1="50" x2="120" y2="80" stroke="#3b82f6" stroke-width="0.8" opacity="0.3" />
  <line x1="820" y1="60" x2="780" y2="100" stroke="#3b82f6" stroke-width="0.8" opacity="0.3" />

  <!-- Main Name Text -->
  <text x="450" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="2">
    ANKIT PANDEY
  </text>

  <!-- Subtitle Tagline -->
  <text x="450" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#79c0ff" letter-spacing="1.5">
    DevOps &amp; Cloud Engineer  |  Linux · Docker · Kubernetes · CI/CD · AWS
  </text>
</svg>
